name: Build iOS WeChatRedPacket

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dylib
        run: |
          make
          file libWeChatRedPacket.dylib
          echo "Build done"

      - name: Download WeChat IPA
        run: |
          echo "Searching for decrypted WeChat IPA..."
          PAGE=$(curl -sL "https://decrypt.day/app/id414478124" 2>/dev/null || true)
          DL_URL=$(echo "$PAGE" | grep -oE 'https?://[^"'"'"' ]*decrypt[^"'"'"' ]*\.ipa' | head -1)
          if [ -z "$DL_URL" ]; then
            DL_URL=$(echo "$PAGE" | grep -oE 'href="[^"]*download[^"]*"' | grep -oE 'https?://[^"]*' | head -1)
          fi
          if [ -z "$DL_URL" ]; then
            echo "Trying backup..."
            DL_URL=$(curl -sL "https://armconverter.com/decryptedappstore" 2>/dev/null | grep -i "wechat" | grep -oE 'https?://[^"'"'"' ]*\.ipa' | head -1)
          fi
          if [ -z "$DL_URL" ]; then
            echo "ERROR: Cannot find IPA"
            exit 1
          fi
          echo "Downloading: $DL_URL"
          curl -L -o WeChat.ipa "$DL_URL" --connect-timeout 30 --max-time 600
          if [ ! -f WeChat.ipa ] || [ $(stat -f%z WeChat.ipa 2>/dev/null || stat -c%s WeChat.ipa) -lt 10000000 ]; then
            echo "ERROR: Download failed"
            exit 1
          fi
          echo "IPA downloaded"

      - name: Inject and sign
        run: |
          mkdir -p _work
          unzip -q WeChat.ipa -d _work
          APP_DIR=$(find _work/Payload -name "*.app" -type d | head -1)
          echo "APP: $APP_DIR"
          cp libWeChatRedPacket.dylib "$APP_DIR/"
          BINARY="$APP_DIR/$(basename "$APP_DIR" .app)"

          if command -v optool &>/dev/null; then
            optool install -c load -p "@executable_path/libWeChatRedPacket.dylib" -t "$BINARY"
          else
            python3 -c "
import struct
p = b'@executable_path/libWeChatRedPacket.dylib\x00'
p = p + b'\x00' * ((8 - len(p) % 8) % 8)
lc = struct.pack('<II', 0x18, len(p) + 8) + p
with open('$BINARY', 'rb') as f: d = f.read()
m = struct.unpack('<I', d[:4])[0]
hs = 32 if m == 0xFEEDFACF else 28
nc = struct.unpack('<I', d[16:20])[0]
nd = d[:hs] + lc + d[hs:]
nd = nd[:16] + struct.pack('<I', nc+1) + nd[20:]
with open('$BINARY', 'wb') as f: f.write(nd)
            "
          fi

          ldid -S "$APP_DIR/libWeChatRedPacket.dylib" 2>/dev/null || \
            codesign --force --sign - --timestamp=none "$APP_DIR/libWeChatRedPacket.dylib"
          ldid -S "$APP_DIR" 2>/dev/null || \
            codesign --force --sign - --timestamp=none "$APP_DIR"
          echo "Done"

      - name: Package IPA
        run: |
          cd _work
          zip -qr ../WeChat_RedPacket.ipa Payload/
          cd ..
          echo "Packaged"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WeChat_RedPacket
          path: WeChat_RedPacket.ipa
