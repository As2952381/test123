name: 编译 Android 微信红包模块

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: '34.0.0'
          packages: 'platforms;android-34'

      - name: 赋予 gradlew 执行权限
        run: chmod +x WeChatRedPacket/gradlew

      - name: 编译 Release APK
        working-directory: WeChatRedPacket
        run: ./gradlew assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: WeChatRedPacket-APK
          path: WeChatRedPacket/app/build/outputs/apk/release/*.apk
