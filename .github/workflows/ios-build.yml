name: "iOS WeChatRedPacket Build"

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "脱壳微信 IPA 下载链接（可选）"
        required: false
        type: string

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build dylib
        run: make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libWeChatRedPacket
          path: libWeChatRedPacket.dylib

      - name: Download IPA
        id: download
        run: |
          URL="${{ inputs.ipa_url }}"
          if [ -z "$URL" ]; then
            echo "No IPA URL provided, skipping injection"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Downloading: $URL"
          curl -L -o WeChat.ipa "$URL" --connect-timeout 30 --max-time 600
          if [ ! -f WeChat.ipa ]; then
            echo "Download failed"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "IPA downloaded ($(du -h WeChat.ipa | cut -f1))"
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Inject and sign
        if: steps.download.outputs.skip != 'true'
        run: |
          set -e
          mkdir -p _work
          unzip -q WeChat.ipa -d _work
          APP_DIR=$(find _work/Payload -name "*.app" -type d | head -1)
          echo "APP: $APP_DIR"
          cp libWeChatRedPacket.dylib "$APP_DIR/"
          BINARY="$APP_DIR/$(basename "$APP_DIR" .app)"
          if command -v optool > /dev/null 2>&1; then
            optool install -c load -p "@executable_path/libWeChatRedPacket.dylib" -t "$BINARY"
          else
            python3 -c "import struct; p=b'@executable_path/libWeChatRedPacket.dylib\x00'; p=p+b'\x00'*((8-len(p)%8)%8); lc=struct.pack('<II',0x18,len(p)+8)+p; f=open('$BINARY','rb'); d=f.read(); f.close(); m=struct.unpack('<I',d[:4])[0]; hs=32 if m==0xFEEDFACF else 28; nc=struct.unpack('<I',d[16:20])[0]; nd=d[:hs]+lc+d[hs:]; nd=nd[:16]+struct.pack('<I',nc+1)+nd[20:]; f=open('$BINARY','wb'); f.write(nd); f.close()"
          fi
          codesign --force --sign - --timestamp=none "$APP_DIR/libWeChatRedPacket.dylib" 2>/dev/null || true
          codesign --force --sign - --timestamp=none "$APP_DIR" 2>/dev/null || true
          echo "Injection done"

      - name: Upload IPA
        if: steps.download.outputs.skip != 'true'
        run: |
          cd _work
          zip -qr ../WeChat_RedPacket.ipa Payload/
          cd ..
          echo "IPA ready"

      - name: Upload IPA artifact
        if: steps.download.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WeChat_RedPacket
          path: WeChat_RedPacket.ipa
